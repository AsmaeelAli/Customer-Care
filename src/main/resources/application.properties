spring.application.name=customercare
server.port=8080

# H2 Database & Console Config
spring.datasource.url=jdbc:h2:file:./data/customercaredb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=123123

# Enable H2 Web Console (Accessible via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
app.jwt.secret=change-this-secret-key-it-must-be-at-least-32-characters-long
# 1 hour in milliseconds
app.jwt.expiration-ms=3600000


